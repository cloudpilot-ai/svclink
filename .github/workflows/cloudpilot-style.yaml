name: style check
'on':
  pull_request:
    branches:
    - main
    - release-*
    - ci-cache-trial/go-cache-20261106
  push:
    branches:
    - main
    - ci-cache-trial/go-cache-20261106
permissions:
  contents: read
  pull-requests: read
jobs:
  style-check:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Restore Go CI cache
      id: setup-go
      uses: cloudx-io/setup-go@0bbd76c0381c065220668df9b6694845b937aaa0
      with:
        go-version: 1.24.10
        cache-key-prefix: ${{ github.job }}
        cache-dependency-path: '**/go.*'
        save: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci-cache-trial/go-cache-20261106') }}
    - name: Restore lint analysis cache
      id: lint-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/golangci-lint
        key: lint-v1.64.8-go-${{ runner.os }}-${{ runner.arch }}-1.24.10-${{ hashFiles('**/go.*', '**/vendor/modules.txt') }}-${{ hashFiles('.golangci*') }}-${{ github.sha }}
        restore-keys: lint-v1.64.8-go-${{ runner.os }}-${{ runner.arch }}-1.24.10-${{ hashFiles('**/go.*', '**/vendor/modules.txt') }}-${{ hashFiles('.golangci*') }}-
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v4
      env:
        GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
      with:
        skip-cache: true
        version: v1.64.8
        args: --timeout=10m --verbose
    - name: verify-codegen-crdgen-update
      run: '# Install the toolchain

        ./hack/toolchain.sh

        # Verify the updates

        ./hack/verify-gen-update.sh

        '
    - name: Save lint analysis cache
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci-cache-trial/go-cache-20261106') && steps.lint-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/golangci-lint
        key: ${{ steps.lint-cache.outputs.cache-primary-key }}
  security-scan:
    if: ${{ (github.event_name == 'pull_request') && (github.event_name != 'push' || github.ref != 'refs/heads/ci-cache-trial/go-cache-20261106') }}
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        ignore-unfixed: true
        format: sarif
        severity: CRITICAL,HIGH
